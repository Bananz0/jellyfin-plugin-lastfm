<!DOCTYPE html>
<html>

<head>
    <title>Last.fm Scrobbler Configuration</title>
</head>

<body>
    <div id="LastfmScrobblerConfigurationPage" data-role="page" data-controller="__plugin/lastfm-controller"
        class="page type-interior pluginConfigurationPage"
        data-require="emby-input,emby-button,emby-select,emby-checkbox">

        <div data-role="content">
            <div class="content-primary">
                <form id="LastfmScrobblerConfigurationForm">
                    <div class="selectContainer">
                        <select is="emby-select" id="user" name="user" label="Configure Last.fm for:"></select>
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" id="username" name="username" type="text" label="Username:" />
                    </div>
                    <div class="inputContainer">
                        <input is="emby-input" id="password" name="password" type="password" label="Password:" />
                    </div>
                    <div class="checkboxContainer">
                        <label>
                            <input is="emby-checkbox" type="checkbox" id="optionScrobble" name="optionScrobble" />
                            <span>Enable Scrobbling for this user?</span>
                        </label>
                    </div>
                    <div class="checkboxContainer">
                        <label>
                            <input is="emby-checkbox" type="checkbox" id="optionFavourite" name="optionFavourite" />
                            <span>Sync favourites for this user?</span>
                        </label>
                    </div>
                    <div class="checkboxContainer">
                        <label>
                            <input is="emby-checkbox" type="checkbox" id="optionSyncPlayCount" name="optionSyncPlayCount" />
                            <span>Import play counts from Last.fm into Jellyfin?</span>
                        </label>
                    </div>
                    <div class="checkboxContainer">
                        <label>
                            <input is="emby-checkbox" type="checkbox" id="optionAltMode" name="optionAltMode" />
                            <span>Use alternative mode and scrobble on UserDataSaved events instead of PlaybackStopped?</span>
                        </label>
                    </div>
                    <details>
                        <summary>Advanced options</summary>
                        <div class="inputContainer">
                            <input is="emby-input" id="apiKey" name="apiKey" type="text" label="API Key:" />
                            <div class="fieldDescription">
                                <p>Your Last.fm API key. Register your own application at <a href="https://www.last.fm/api/account/create" target="_blank">last.fm/api/account/create</a> to get one.</p>
                            </div>
                        </div>
                        <div class="inputContainer">
                            <input is="emby-input" id="apiSecret" name="apiSecret" type="password" label="API Secret:" />
                        </div>
                        <div class="inputContainer">
                            <input is="emby-input" id="apiHost" name="apiHost" type="text" label="API host:" />
                            <div class="fieldDescription">
                                <p>For Last.fm, use: ws.audioscrobbler.com - For Libre.fm, use: libre.fm</p>
                                <p>If you change this setting, you need specify the password again, before saving, or it won't work.</p>
                            </div>
                        </div>
                    </details>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
